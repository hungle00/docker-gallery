{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">🐳 Quản lý Docker Containers</h2>
            <p class="text-sm text-gray-500 mt-1">Danh sách các container đang hoạt động và đã dừng trên máy chủ của bạn.</p>
        </div>
        <button hx-get="/partials/containers-table" hx-target="#container-table-wrapper" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 shadow transition flex items-center gap-2">
            🔄 Làm mới
        </button>
    </div>

    <!-- Automatically load the container table with HTMX (poll every 5 seconds) -->
    <div hx-get="/partials/containers-table" hx-trigger="load, every 5s" hx-swap="outerHTML">
        <div id="container-table-wrapper" class="bg-white p-8 rounded-lg shadow text-center text-gray-500">
            Đang tải danh sách container...
        </div>
    </div>
</div>
{% endblock %}
