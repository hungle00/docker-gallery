<div id="container-table-wrapper" class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Image</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200 text-sm">
                {% for c in containers %}
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap font-mono text-gray-500">{{ c.id }}</td>
                    <td class="px-6 py-4 whitespace-nowrap font-semibold text-gray-800">
                        <a href="/containers/{{ c.id }}/detail" class="text-blue-600 hover:underline">{{ c.name }}</a>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-600 truncate max-w-xs" title="{{ c.image }}">{{ c.image }}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-full 
                            {% if c.status == 'running' %} bg-green-100 text-green-800 
                            {% else %} bg-red-100 text-red-800 {% endif %}">
                            {{ c.status }}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-center space-x-2">
                        {% if c.status == 'running' %}
                        <button hx-post="/api/containers/{{ c.id }}/stop" hx-target="#container-table-wrapper" hx-swap="outerHTML" class="bg-yellow-500 text-white px-3 py-1 rounded text-xs font-medium hover:bg-yellow-600 transition">Stop</button>
                        <button hx-post="/api/containers/{{ c.id }}/restart" hx-target="#container-table-wrapper" hx-swap="outerHTML" class="bg-blue-500 text-white px-3 py-1 rounded text-xs font-medium hover:bg-blue-600 transition">Restart</button>
                        {% else %}
                        <button hx-post="/api/containers/{{ c.id }}/start" hx-target="#container-table-wrapper" hx-swap="outerHTML" class="bg-green-500 text-white px-3 py-1 rounded text-xs font-medium hover:bg-green-600 transition">Start</button>
                        {% endif %}
                        <button hx-delete="/api/containers/{{ c.id }}" hx-target="#container-table-wrapper" hx-swap="outerHTML" hx-confirm="Bạn có chắc chắn muốn xóa container này không?" class="bg-red-500 text-white px-3 py-1 rounded text-xs font-medium hover:bg-red-600 transition">Remove</button>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="px-6 py-8 text-center text-gray-500">Không tìm thấy container nào.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
