<div id="volume-table-wrapper" class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Driver</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Scope</th>
                    <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200 text-sm">
                {% for vol in volumes %}
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap font-semibold text-gray-800">{{ vol.name }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-600">{{ vol.driver }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-600">{{ vol.scope }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-center">
                        <button hx-delete="/api/volumes/{{ vol.name }}" hx-target="#volume-table-wrapper" hx-swap="outerHTML" hx-confirm="Bạn có chắc muốn xóa volume này không?" class="bg-red-500 text-white px-3 py-1 rounded text-xs font-medium hover:bg-red-600 transition">Remove</button>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="px-6 py-8 text-center text-gray-500">Không tìm thấy volume nào.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
