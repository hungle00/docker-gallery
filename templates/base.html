<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Docker Gallery{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR BÊN TRÁI -->
        <aside class="w-64 bg-gray-900 text-gray-300 flex flex-col shadow-lg flex-shrink-0">
            <!-- Logo / Brand -->
            <div class="h-16 flex items-center px-6 bg-gray-950 text-white font-bold text-lg gap-2 border-b border-gray-800">
                <span>🐳</span> Docker Gallery
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 px-4 py-6 space-y-1">
                <a href="/" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium bg-blue-600 text-white transition">
                    📦 Containers
                </a>
                <a href="/images" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-800 hover:text-white transition">
                    💿 Images
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-800 hover:text-white transition">
                    🌐 Networks
                </a>
                <a href="/volumes" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-800 hover:text-white transition">
                    💾 Volumes
                </a>
            </nav>

            <!-- Footer Sidebar -->
            <div class="p-4 border-t border-gray-800 text-xs text-gray-500 text-center">
                Lightweight Docker Dashboard &copy; 2026
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Top Header nhỏ -->
            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm flex-shrink-0">
                <h1 class="text-lg font-semibold text-gray-800">Docker Gallery</h1>
                <div class="text-sm text-green-600 font-medium flex items-center gap-2">
                    <span class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></span> Docker Daemon Connected
                </div>
            </header>

            <!-- Scrollable Content -->
            <main class="flex-1 overflow-y-auto p-8">
                {% block content %}{% endblock %}
            </main>
        </div>

    </div>
</body>
</html>
